<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f8a70">
<title>每日20分钟 · 三年级练习</title>
<style>
:root{
  --brand:#1f8a70; --brand-soft:#e6f4f0; --brand-dark:#166b56;
  --red:#e0483c; --red-soft:#fdeceb; --green:#2e9e5b; --amber:#e08b1f;
  --bg:#f4f6f8; --card:#ffffff; --line:#e8ecef;
  --t1:#1c2429; --t2:#5b6873; --t3:#9aa5ae;
  --r:16px; --sh:0 1px 3px rgba(20,40,50,.06),0 6px 18px rgba(20,40,50,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--t1)}
.hide{display:none !important}
#app{max-width:640px;margin:0 auto;padding:0 14px}

/* 顶部 */
.topbar{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between}
.topbar .date{font-size:13px;color:var(--t2)}
.topbar .title{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.streak{background:var(--brand-soft);color:var(--brand-dark);font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap}

/* 卡片 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card.tight{padding:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between}
.muted{color:var(--t2);font-size:13px}
.tiny{color:var(--t3);font-size:12px}

/* 进度 */
.ring{width:78px;height:78px;position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:20px;line-height:1}
.ring .val span{font-size:10px;color:var(--t3)}

/* 科目条目 */
.subj{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px;width:100%;text-align:left}
.subj:active{transform:scale(.985)}
.ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;flex:0 0 auto}
.ico.cn{background:#e3734a}.ico.ma{background:#4a7fe3}.ico.en{background:#b060c0}
.subj .n{font-weight:600;font-size:16px}
.subj .s{font-size:12px;color:var(--t2);margin-top:1px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--line);color:var(--t2)}
.badge.done{background:var(--brand-soft);color:var(--brand-dark)}
.badge.todo{background:#eef2f5;color:var(--t2)}
.chev{color:var(--t3);font-size:18px}

/* 按钮 */
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:600;font-size:16px;text-align:center}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--brand-soft);color:var(--brand-dark)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--t1)}
.btn.gray{background:#eef2f5;color:var(--t2)}
.btn.sm{padding:10px;font-size:14px;border-radius:11px}
.btnrow{display:flex;gap:10px}

/* 练习页 */
.pbar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 14px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t2)}
.qbox{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 16px;margin-bottom:12px}
.qtext{font-size:18px;line-height:1.9;letter-spacing:.2px;word-break:break-word}
.qtext em{font-style:normal;color:var(--brand-dark);font-weight:600}
.blank{display:inline-block;min-width:76px;border-bottom:2px solid var(--brand);margin:0 2px;text-align:center;color:var(--brand-dark);font-weight:600}
.hint{font-size:12px;color:var(--t3);margin-top:8px}
.ansinput{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;margin-top:4px}
.ansinput:focus{border-color:var(--brand)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-size:15px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opt .k{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--t2);font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.opt.on .k{background:var(--brand);color:#fff}
.play{width:100%;padding:22px;border-radius:16px;background:var(--brand-soft);color:var(--brand-dark);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.play:active{background:#d7ece6}
.play circle,.play path{stroke:currentColor}

/* 结果 */
.score{text-align:center;padding:20px 0 6px}
.score .num{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1}
.score .num small{font-size:16px;font-weight:600;color:var(--t3)}
.qitem{border-bottom:1px solid var(--line);padding:12px 0}
.qitem:last-child{border:none}
.qitem .q{font-size:14px;color:var(--t2)}
.qitem .a{font-size:15px;margin-top:5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px}
.tag.ok{background:#e8f6ed;color:var(--green)}
.tag.no{background:var(--red-soft);color:var(--red)}

/* 表单行 */
.frow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border:none}
.frow .lab{font-size:15px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:32px;height:32px;border-radius:10px;background:#eef2f5;font-size:18px;font-weight:600;color:var(--t2);line-height:1}
.stepper .v{min-width:34px;text-align:center;font-weight:700;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 13px;border-radius:20px;background:#eef2f5;font-size:13px;color:var(--t2)}
.chip.on{background:var(--brand);color:#fff;font-weight:600}
.drafttoggle{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}
.drafttoggle .chip{min-width:80px;text-align:center}
select.ctl{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px;outline:none;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar .tb{flex:1;padding:9px 0 8px;text-align:center;font-size:11px;color:var(--t3)}
.tabbar .tb.on{color:var(--brand);font-weight:700}
.tabbar .tb .d{font-size:19px;display:block;line-height:1.4}
body.practicing .tabbar{display:none}
body.practicing{padding-bottom:20px}

/* 统计 */
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;background:var(--brand);border-radius:5px 5px 2px 2px;min-height:3px}
.bars .b span{font-size:10px;color:var(--t3)}
.empty{text-align:center;color:var(--t3);font-size:13px;padding:34px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(28,36,41,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* 数字键盘 / 手写 */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pad button{height:50px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px;font-weight:600;color:var(--t1);padding:0}
.pad button:active{background:var(--brand-l);border-color:var(--brand)}
.pad button.fn{font-size:14px;color:var(--t2)}
.pad button.wide{grid-column:span 2}
.hwrap{margin-top:10px;display:flex;flex-direction:column;align-items:center}
#hw{width:100%;max-width:300px;aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:#fff;touch-action:none;display:block}
.cands{display:flex;flex-wrap:nowrap;gap:7px;justify-content:flex-start;margin-top:9px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cands::-webkit-scrollbar{display:none}
.cands button{flex:0 0 auto;min-width:50px;height:48px;font-size:24px;border:1.5px solid var(--line);background:#fff;border-radius:11px;color:var(--t1);padding:0 6px;white-space:nowrap}
.cands button:active{background:var(--brand-l)}
.blanks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;justify-content:center}
.blanks .bs{min-width:64px;height:44px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--brand-dark)}
.blanks .bs.cur{border-bottom-color:var(--brand);background:var(--brand-l);border-radius:8px}
.hwbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.hwbar button{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;padding:0 2px}
</style>
</head>

/* ---------- 工具 ---------- */
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rngFrom(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1));}
function pick(r,arr){return arr[Math.floor(r()*arr.length)];}
function shuffle(r,arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function p2(n){return n<10?"0"+n:""+n;}
function weekday(d){return ["日","一","二","三","四","五","六"][new Date(d).getDay()];}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1600);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* 答案规范化比对 */
function norm(s){
  return String(s==null?"":s)
    .replace(/\s+/g,"")
    .replace(/[，。、；：？！“”‘’（）【】《》,.;:?!'"()\[\]]/g,"")
    .replace(/[…]{1,}|[．.]{2,}|。{2,}/g,"…")
    .replace(/余/g,"…")
    .replace(/／/g,"/")
    .replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);})
    .toLowerCase();
}
function isRight(user,ans){
  var u=norm(user);
  if(u==="")return false;
  var A=String(ans);
  var opts=A.indexOf("||")>=0?A.split("||").map(norm):[norm(A)];
  for(var i=0;i<opts.length;i++){if(u===opts[i])return true;}
  // 纯数值容错
  if(!isNaN(parseFloat(u))&&!isNaN(parseFloat(opts[0]))&&parseFloat(u)===parseFloat(opts[0])&&u.indexOf("…")<0)return true;
  return false;
}

function mergeBank(base,extra){
  if(!extra||!extra.length)return base;
  var seen={},out=base.slice(),i;
  for(i=0;i<base.length;i++)seen[(base[i].t||base[i].q||base[i].say||"")+"|"+base[i].a]=1;
  for(i=0;i<extra.length;i++){
    var x=extra[i],k=(x.t||x.q||x.say||"")+"|"+x.a;
    if(!seen[k]){seen[k]=1;out.push(x);}
  }
  return out;
}

/* 语文：按「课次 + 内容类型」组卷，题量由课本决定 */
function cnPool(){
  var lessons=(S.cnLessons&&S.cnLessons.length)?S.cnLessons:["第6课"];
  var kinds=(S.cnKinds&&S.cnKinds.length)?S.cnKinds:["zi","ci","shi"];
  var pool=CN.filter(function(q){
    return lessons.indexOf(q.g)>=0&&kinds.indexOf(q.k||"ci")>=0;
  });
  return pool.length?pool:CN.slice();
}
function cnLessonText(){
  return (S.cnLessons&&S.cnLessons.length)?S.cnLessons.join("、"):"第6课";
}
function buildQuestions(subj,date){
  var r=rngFrom(hashStr(subj+"|"+date+"|"+(load("salt","")||"")));
  var n=S.count[subj], out=[];
  if(subj==="cn"){
    var pool0=cnPool();
    var pool=shuffle(r,pool0);
    for(var i=0;i<pool.length;i++){
      var q=pool[i];
      out.push({kind:"cn",text:q.t,ans:q.a,tip:q.tip||"",unit:q.g||""});
    }
  }else if(subj==="ma"){
    var types=S.mathTypes.length?S.mathTypes.slice():["add2"];
    var mixOn=types.indexOf("mix2")>=0;
    var base=[],ti;
    for(ti=0;ti<types.length;ti++){if(types[ti]!=="mix2")base.push(types[ti]);}
    if(!base.length)base=["add2"];
    base=shuffle(r,base);
    var mr=(typeof S.mixRate==="number")?S.mixRate:0.5;
    var gen=[],i2,used={},mixHave=0,bi=0;
    for(i2=0;i2<n;i2++){
      var ty;
      if(mixOn&&mixHave<Math.round((i2+1)*mr)){ty="mix2";mixHave++;}
      else{ty=base[bi++%base.length];}
      var q=pickMa(r,ty,used)||genMath(r,ty);
      if(q)gen.push(q);
    }
    // 补足
    var guard=0;
    while(gen.length<n&&guard++<80){var ty2=pick(r,types);var q2=pickMa(r,ty2,used)||genMath(r,ty2);if(q2)gen.push(q2);}
    out=gen.slice(0,n);
  }else{
    var pool2=EN.filter(function(e){
      return !S.enUnits||!S.enUnits.length||S.enUnits.indexOf(e.u)>=0;
    });
    if(!pool2.length)pool2=EN;
    // 按单元轮流抽取，保证每天覆盖尽量多的单元
    var byU={},order=[],kk;
    pool2.forEach(function(e){kk=e.u||"U1";if(!byU[kk]){byU[kk]=[];order.push(kk);}byU[kk].push(e);});
    for(kk in byU){byU[kk]=shuffle(r,byU[kk]);}
    order=shuffle(r,order);
    var picked=[],ui=0,want=Math.min(n,pool2.length);
    while(picked.length<want&&ui<600){
      var uk=order[ui%order.length];
      if(byU[uk]&&byU[uk].length)picked.push(byU[uk].pop());
      ui++;
    }
    for(var j=0;j<picked.length;j++){
      var e=picked[j];
      var opts=e.opts?shuffle(r,e.opts):makeOpts(r,e);
      out.push({kind:"en",say:e.say,zh:e.zh,type:e.type,q:e.q,a:e.a,ans:e.a,opts:opts,unit:e.u||""});
    }
  }
  return out;
}

function makeOpts(r,e){
  var isWord=e.type==="word";
  var correct=isWord?(e.a||""):(e.zh||e.a||"");
  var pool=[];
  EN.forEach(function(x){
    if(x===e)return;
    var v=isWord?(x.type==="word"?x.a:null):(x.zh||null);
    if(v&&v!==correct&&pool.indexOf(v)<0)pool.push(v);
  });
  var extras=isWord?["apple","book","desk","school"]:["你好。","再见。","谢谢你。","请坐。"];
  var o=[correct],p=shuffle(r,pool),i;
  for(i=0;i<p.length&&o.length<4;i++)o.push(p[i]);
  for(i=0;i<extras.length&&o.length<4;i++){if(o.indexOf(extras[i])<0)o.push(extras[i]);}
  return o;
}
function pickMa(r,ty,used){
  var pool=[],i;
  for(i=0;i<MA.length;i++){var x=MA[i];if(x.k===ty&&!used[x.t])pool.push(x);}
  if(!pool.length)return null;
  var y=pool[Math.floor(r()*pool.length)];
  used[y.t]=1;
  return {kind:"ma",text:y.t,ans:String(y.a),tip:y.tip||"",unit:ty};
}
function autoKind(t){
  t=String(t).replace(/[‐-―−˗－⁻₋]/g,"-");
  var m;
  if(t.indexOf("×")>=0){m=t.match(/(\d+)\s*×\s*(\d+)/);if(m)return (+m[1]%10===0||+m[2]%10===0)?"mul10":"mul1";return "mul1";}
  if(t.indexOf("÷")>=0)return "div1";
  m=t.match(/(\d+)\s*[+\-]\s*(\d+)/);
  if(m)return (+m[1]<100&&+m[2]<100)?"add2":"add3";
  return "word";
}
/* 两步综合计算：三上范围内，先乘除后加减 / 带小括号 / 连乘连除 */
function genMix2(r){
  var t=ri(r,0,10),a,b,c,s,k,sum,q,ans;
  if(t===0){a=ri(r,12,89);b=ri(r,2,9);c=ri(r,11,99);q=a+" × "+b+" + "+c+" =";ans=a*b+c;}
  else if(t===1){a=ri(r,20,89);b=ri(r,3,9);c=ri(r,11,a*b-11);q=a+" × "+b+" − "+c+" =";ans=a*b-c;}
  else if(t===2){b=ri(r,2,9);s=ri(r,11,50);a=b*s;c=ri(r,11,99);q=a+" ÷ "+b+" + "+c+" =";ans=s+c;}
  else if(t===3){b=ri(r,2,9);s=ri(r,20,90);a=b*s;c=ri(r,10,s-1);q=a+" ÷ "+b+" − "+c+" =";ans=s-c;}
  else if(t===4){a=ri(r,11,60);b=ri(r,10,40);c=ri(r,2,9);q="（"+a+" + "+b+"）× "+c+" =";ans=(a+b)*c;}
  else if(t===5){a=ri(r,40,99);b=ri(r,10,39);c=ri(r,2,9);q="（"+a+" − "+b+"）× "+c+" =";ans=(a-b)*c;}
  else if(t===6){c=ri(r,2,9);s=ri(r,11,60);sum=s*c;a=ri(r,10,sum-10);b=sum-a;q="（"+a+" + "+b+"）÷ "+c+" =";ans=s;}
  else if(t===7){c=ri(r,2,9);s=ri(r,11,50);a=ri(r,s*c+11,s*c+60);b=a-s*c;q="（"+a+" − "+b+"）÷ "+c+" =";ans=s;}
  else if(t===8){c=ri(r,2,9);k=ri(r,3,19);a=c*k;b=ri(r,2,9);q=a+" × "+b+" ÷ "+c+" =";ans=k*b;}
  else if(t===9){a=ri(r,120,560);b=ri(r,105,320);c=ri(r,50,a+b-1);q=a+" + "+b+" − "+c+" =";ans=a+b-c;}
  else{a=ri(r,300,900);b=ri(r,105,a-50);c=ri(r,50,200);q=a+" − "+b+" + "+c+" =";ans=a-b+c;}
  return [q,ans];
}
function genMath(r,ty){
  var a,b,c,q,ans;
  if(ty==="mix2"){var m2=genMix2(r);return {kind:"ma",text:m2[0],ans:String(m2[1]),tip:"",unit:"mix2"};}
  if(ty==="add2"){
    if(r()<.5){a=ri(r,11,89);b=ri(r,11,89);q=a+" + "+b+" =";ans=a+b;}
    else{a=ri(r,30,99);b=ri(r,10,a-1);q=a+" − "+b+" =";ans=a-b;}
  }else if(ty==="add3"){
    if(r()<.5){a=ri(r,120,780);b=ri(r,105,219);q=a+" + "+b+" =";ans=a+b;}
    else{a=ri(r,300,980);b=ri(r,110,a-10);q=a+" − "+b+" =";ans=a-b;}
  }else if(ty==="mul1"){
    if(r()<.4){a=ri(r,2,9);b=ri(r,2,9);}
    else{a=ri(r,12,89);b=ri(r,2,9);}
    q=a+" × "+b+" =";ans=a*b;
  }else if(ty==="div1"){
    b=ri(r,2,9);var s=ri(r,2,11);a=b*s;
    if(r()<.35){a+=ri(r,1,b-1);var sh=Math.floor(a/b);var re=a%b;
      q=a+" ÷ "+b+" =";ans=sh+"…"+re;
    }else{q=a+" ÷ "+b+" =";ans=s;}
  }else if(ty==="mul10"){
    if(r()<.5){a=ri(r,10,90);b=ri(r,10,90);q=a+" × "+b+" =";ans=a*b;}
    else{a=ri(r,2,9);b=ri(r,10,90);q=a+" × "+b+" =";ans=a*b;}
  }else if(ty==="mul2"){
    a=ri(r,11,39);b=ri(r,11,29);q=a+" × "+b+" =";ans=a*b;
  }else if(ty==="unit"){
    var U=[
      function(){var x=ri(r,2,9);return[x+"千克＝（ ）克",x*1000];},
      function(){var x=ri(r,2,9);return[x*1000+"克＝（ ）千克",x];},
      function(){var x=ri(r,2,9);return[x+"米＝（ ）分米",x*10];},
      function(){var x=ri(r,2,9);return[x+"千克＝（ ）克",x*1000];},
      function(){var x=ri(r,2,9);return[x+"时＝（ ）分",x*60];},
      function(){var x=ri(r,2,9);return[x+"分＝（ ）秒",x*60];},
      function(){var x=ri(r,2,9);return[x+"米＝（ ）厘米",x*100];},
      function(){var x=ri(r,2,9);return[x+"元＝（ ）角",x*10];}
    ];
    var u=pick(r,U)();q=u[0];ans=u[1];
  }else if(ty==="peri"){
    if(r()<.5){a=ri(r,3,20);b=ri(r,2,15);q="长方形长"+a+"厘米，宽"+b+"厘米，周长＝（ ）厘米";ans=2*(a+b);}
    else{a=ri(r,3,20);q="正方形边长"+a+"厘米，周长＝（ ）厘米";ans=4*a;}
  }else if(ty==="frac"){
    var d=ri(r,4,9);a=ri(r,1,d-1);b=ri(r,1,d-a);
    q=a+"/"+d+" + "+b+"/"+d+" =";
    var nn=a+b,gg=gcd(nn,d);
    ans=(nn/gg)+"/"+(d/gg);
    if(d/gg===1)ans=String(nn/gg);
  }else if(ty==="deci"){
    a=(ri(r,10,99)/10);b=(ri(r,10,99)/10);
    if(r()<.5){q=a.toFixed(1)+" + "+b.toFixed(1)+" =";ans=Math.round((a+b)*10)/10;}
    else{if(b>a){var t=a;a=b;b=t;}q=a.toFixed(1)+" − "+b.toFixed(1)+" =";ans=Math.round((a-b)*10)/10;}
  }else{
    var w=pick(r,MA);q=w.t;ans=w.a;
  }
  return {kind:"ma",text:q,ans:String(ans),tip:"",unit:ty};
}
function gcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}

var voice=null,enVoices=[],allVoices=[],speakErr="",speakTimer=null;
function loadVoices(){
  if(!window.speechSynthesis)return;
  var vs=[],i;
  try{vs=speechSynthesis.getVoices()||[];}catch(e){vs=[];}
  allVoices=vs;enVoices=[];
  for(i=0;i<vs.length;i++){if(/^en/i.test(vs[i].lang||""))enVoices.push(vs[i]);}
  voice=null;
  for(i=0;i<enVoices.length;i++){if(/en[-_]US/i.test(enVoices[i].lang)){voice=enVoices[i];break;}}
  if(!voice&&enVoices.length)voice=enVoices[0];
}
if(window.speechSynthesis){
  loadVoices();
  try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
  setTimeout(loadVoices,200);setTimeout(loadVoices,1000);setTimeout(loadVoices,3000);
}
function hasEnVoice(){return enVoices.length>0;}
function voiceDiag(){
  if(!window.speechSynthesis)return "这个浏览器不支持朗读，请改用手机自带浏览器（安卓 Chrome / iPhone Safari）打开，微信里打开是没声音的。";
  loadVoices();
  if(!allVoices.length)return "还没读到系统语音列表（可能刚打开），等 2 秒再点一次「试听」；一直为空说明手机没装文字转语音引擎。";
  if(!enVoices.length){
    return "检测到 "+allVoices.length+" 个语音，但没有英文的。<br>安卓：设置 → 系统 → 语言和输入法 → 文字转语音（TTS）→ 安装「英语（美国）」语音数据；<br>iPhone：设置 → 辅助功能 → 朗读内容 → 声音 → 英语 → 下载。";
  }
  return "英文语音已就位："+esc(voice?voice.name:"默认")+"（共 "+enVoices.length+" 个）。若仍没声音：检查手机是否静音、媒体音量是否调到 0，并确认不是用微信打开的。";
}
function speak(text,rate){
  if(!window.speechSynthesis)return false;
  try{
    loadVoices();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=rate||S.rate||0.8;u.pitch=1;u.volume=1;
    if(voice)u.voice=voice;
    u.onstart=function(){speakErr="";};
    u.onerror=function(e){speakErr=(e&&e.error)||"unknown";toast("朗读失败（"+speakErr+"），请到设置 → 英语检测语音");};
    if(speechSynthesis.speaking||speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(function(){try{speechSynthesis.speak(u);}catch(e){}},90);
    }else{
      speechSynthesis.speak(u);
    }
    clearInterval(speakTimer);
    speakTimer=setInterval(function(){
      try{if(!speechSynthesis.speaking){clearInterval(speakTimer);return;}speechSynthesis.resume();}catch(e){clearInterval(speakTimer);}
    },2500);
    return true;
  }catch(e){return false;}
}
/* 安卓/iOS/微信：必须在用户点击的手势里先唤醒一次语音引擎，否则全程无声 */
var speechUnlocked=false;
function unlockSpeech(){
  if(!window.speechSynthesis)return;
  try{
    loadVoices();
    if(!speechUnlocked){
      var u=new SpeechSynthesisUtterance(" ");
      u.lang="en-US";u.volume=0;u.rate=1;
      speechSynthesis.speak(u);
      speechUnlocked=true;
    }
  }catch(e){}
}

function progressOf(){
  var day=getDay(today()),tot=0,done=0,cor=0,all=0;
  SUBJ_KEYS.forEach(function(k){if(day[k]){done++;tot+=day[k].score;all+=day[k].total;}});
  return {done:done,rate:all?Math.round(tot/all*100):0,all:all,cor:tot};
}
function streakDays(){
  var d=new Date(),n=0;
  for(var i=0;i<400;i++){
    var key=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
    var day=load(dayKey(key),null);
    var hit=false;SUBJ_KEYS.forEach(function(k){if(day&&day[k])hit=true;});
    if(hit)n++;
    else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* ---------- 手写汉字：字形匹配识别（离线，不联网） ---------- */
var HPOOL=null,HGLYPH={},HSIZE=40;
function hanziPool(){
  if(HPOOL)return HPOOL;
  var s={},i,j,c;
  for(i=0;i<CN.length;i++){
    var a=String(CN[i].a||"");
    for(j=0;j<a.length;j++){c=a[j];if(c.charCodeAt(0)>=0x4e00&&c.charCodeAt(0)<=0x9fa5)s[c]=1;}
  }
  HPOOL=Object.keys(s);
  return HPOOL;
}
function binarize(img,size){
  var d=img.data,out=new Uint8Array(size*size),i,v;
  for(i=0;i<size*size;i++){
    var a=d[i*4+3];
    v=a<128?255:(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]);
    out[i]=v<150?1:0;
  }
  return out;
}
function glyphBm(ch){
  if(HGLYPH[ch])return HGLYPH[ch];
  var size=HSIZE,cv=document.createElement("canvas");
  cv.width=size;cv.height=size;
  var g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,size,size);
  g.fillStyle="#000";g.textAlign="center";g.textBaseline="middle";
  g.font=Math.round(size*0.78)+"px sans-serif";
  g.fillText(ch,size/2,size/2+size*0.04);
  var bm=binarize(g.getImageData(0,0,size,size),size);
  HGLYPH[ch]=bm;
  return bm;
}
function distField(bm,size){
  var INF=1e6,f=new Float32Array(size*size),i,x,y,k,v,t;
  for(i=0;i<size*size;i++)f[i]=bm[i]?0:INF;
  for(y=0;y<size;y++)for(x=0;x<size;x++){
    k=y*size+x;v=f[k];
    if(x>0){t=f[k-1]+1;if(t<v)v=t;}
    if(y>0){t=f[k-size]+1;if(t<v)v=t;}
    if(x>0&&y>0){t=f[k-size-1]+1.414;if(t<v)v=t;}
    if(x<size-1&&y>0){t=f[k-size+1]+1.414;if(t<v)v=t;}
    f[k]=v;
  }
  for(y=size-1;y>=0;y--)for(x=size-1;x>=0;x--){
    k=y*size+x;v=f[k];
    if(x<size-1){t=f[k+1]+1;if(t<v)v=t;}
    if(y<size-1){t=f[k+size]+1;if(t<v)v=t;}
    if(x<size-1&&y<size-1){t=f[k+size+1]+1.414;if(t<v)v=t;}
    if(x>0&&y<size-1){t=f[k+size-1]+1.414;if(t<v)v=t;}
    f[k]=v;
  }
  return f;
}
function strokesBm(strokes){
  var size=HSIZE,cv=document.createElement("canvas");
  cv.width=size;cv.height=size;
  var g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,size,size);
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,has=false;
  strokes.forEach(function(st){st.forEach(function(p){
    has=true;
    if(p[0]<minx)minx=p[0];if(p[0]>maxx)maxx=p[0];
    if(p[1]<miny)miny=p[1];if(p[1]>maxy)maxy=p[1];
  });});
  if(!has)return null;
  var w=Math.max(maxx-minx,1),h=Math.max(maxy-miny,1);
  var sc=(size-10)/Math.max(w,h);
  var ox=(size-w*sc)/2,oy=(size-h*sc)/2;
  g.strokeStyle="#000";g.lineWidth=Math.max(2.5,size*0.075);g.lineCap="round";g.lineJoin="round";
  strokes.forEach(function(st){
    if(!st.length)return;
    g.beginPath();
    for(var i=0;i<st.length;i++){
      var x=ox+(st[i][0]-minx)*sc,y=oy+(st[i][1]-miny)*sc;
      if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
    }
    if(st.length===1)g.lineTo(ox+(st[0][0]-minx)*sc+0.6,oy+(st[0][1]-miny)*sc);
    g.stroke();
  });
  return binarize(g.getImageData(0,0,size,size),size);
}
function recognize(strokes,cands){
  var bm=strokesBm(strokes);
  if(!bm)return [];
  var size=HSIZE,fA=distField(bm,size),res=[],i,j;
  for(i=0;i<cands.length;i++){
    var bmB=glyphBm(cands[i]),fB=distField(bmB,size);
    var sa=0,na=0,sb=0,nb=0;
    for(j=0;j<size*size;j++){if(bm[j]){sa+=fB[j];na++;}}
    for(j=0;j<size*size;j++){if(bmB[j]){sb+=fA[j];nb++;}}
    res.push({c:cands[i],d:(na?sa/na:9)+(nb?sb/nb:9)});
  }
  res.sort(function(a,b){return a.d-b.d;});
  return res;
}
function candSet(ans){
  var chars=[],i,c;
  for(i=0;i<ans.length;i++){c=ans[i];if(c.charCodeAt(0)>=0x4e00&&c.charCodeAt(0)<=0x9fa5&&chars.indexOf(c)<0)chars.push(c);}
  var pool=hanziPool(),extra=[],r=rngFrom(hashStr(ans)+9871),guard=0;
  while(extra.length<36&&guard++<600){
    var p=pool[Math.floor(r()*pool.length)];
    if(p&&chars.indexOf(p)<0&&extra.indexOf(p)<0)extra.push(p);
  }
  return chars.concat(extra);
}
function cnHandOK(ans){
  var s=String(ans||"");
  if(!s.length||s.length>8)return false;
  return /^[\u4e00-\u9fa5]+$/.test(s);
}

function blankCount(q){

  return Math.max(raw.split("@@BL@@").length-1,1);

function hwVals(){

function hwGrid(g,w,h){
  g.fillStyle="#fff";g.fillRect(0,0,w,h);
  g.strokeStyle="#e8edf1";g.lineWidth=1;
  g.beginPath();
  g.moveTo(w/2,0);g.lineTo(w/2,h);
  g.moveTo(0,h/2);g.lineTo(w,h/2);
  g.moveTo(0,0);g.lineTo(w,h);
  g.moveTo(w,0);g.lineTo(0,h);
  g.stroke();
  g.strokeStyle="#dbe2e8";g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);
}
function hwLine(g,cv,a,b){
  g.strokeStyle="#1c2429";g.lineWidth=3;g.lineCap="round";g.lineJoin="round";
  g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
}
function hwInit(){
  var cv=$("hw");
  if(!cv||!cv.getContext)return;
  var g=cv.getContext("2d");
  hwGrid(g,cv.width,cv.height);
  if(!ST.hwStrokes.length)ST.hwStrokes=[];
  var drawing=false,cur=null,timer=null;
  function pos(e){
    var r=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])?e.touches[0]:e;
    return [(t.clientX-r.left)*(cv.width/r.width),(t.clientY-r.top)*(cv.height/r.height)];
  }
  function start(e){if(e.cancelable)e.preventDefault();drawing=true;cur=[pos(e)];ST.hwStrokes.push(cur);clearTimeout(timer);}
  function move(e){if(!drawing)return;if(e.cancelable)e.preventDefault();var p=pos(e);cur.push(p);hwLine(g,cv,cur[cur.length-2],p);}
  function end(){if(!drawing)return;drawing=false;clearTimeout(timer);timer=setTimeout(hwRecognize,420);}
  cv.addEventListener("touchstart",start,{passive:false});
  cv.addEventListener("touchmove",move,{passive:false});
  cv.addEventListener("touchend",end,{passive:true});
  cv.addEventListener("touchcancel",end,{passive:true});
  cv.addEventListener("mousedown",start);
  cv.addEventListener("mousemove",move);
  cv.addEventListener("mouseup",end);
  cv.addEventListener("mouseleave",end);
}

function draftInit(){

  function start(e){if(e.cancelable)e.preventDefault();DRAFT.drawing=true;DRAFT.last=pos(e);DRAFT.ctx.beginPath();DRAFT.ctx.moveTo(DRAFT.last[0],DRAFT.last[1]);}

function collectAnswer(){
  var q=ST.qs[ST.idx];
  if(q&&q.kind==="cn"&&S.cnInput!=="key"&&cnHandOK(q.ans))return ST.answers[ST.idx]||"";
  if(q&&q.kind==="en"&&q.type!=="fill"){
    var on=document.querySelector(".opt.on");
    return on?on.getAttribute("data-o"):"";
  }
  var ins=document.querySelectorAll(".blankinp");
  if(ins.length){
    var arr=[];for(var i=0;i<ins.length;i++)arr.push(ins[i].value.trim());
    return arr.join("|");
  }
  var a0=$("ans0");
  return a0?a0.value.trim():"";
}

/* ---------- 结果 ---------- */
function finish(){
  var q=ST.qs[ST.idx];
  ST.answers[ST.idx]=collectAnswer();
  var i,score=0,details=[],redo=!!ST.redo;
  for(i=0;i<ST.qs.length;i++){
    var qq=ST.qs[i],u=ST.answers[i]||"";
    var ok=isRight(u,qq.ans);
    var key=wrongKey({s:qq.s||ST.subj,q:qq.text||qq.say,a:qq.ans});
    if(ok){
      score++;
      if(redo){var wi=wrongHas(key);if(wi>=0)WRONG.splice(wi,1);}
    }else if(!redo&&wrongHas(key)<0){
      WRONG.unshift({s:ST.subj,q:qq.text||qq.say,a:qq.ans,u:u,tip:qq.tip||"",d:today(),say:qq.say||""});
    }
    details.push({ok:ok,u:u,q:qq});
  }
  WRONG=WRONG.slice(0,300);saveWrong();
  var sec=Math.round((Date.now()-ST.start)/1000);
  var rec={score:score,total:ST.qs.length,sec:sec};
  if(!redo){
    var d=today(),day=getDay(d);day[ST.subj]=rec;saveDay(d,day);
  }
  ST.result={score:score,total:ST.qs.length,sec:sec,details:details,subj:ST.subj,redo:redo};
  ST.tab="result";document.body.classList.remove("practicing");
  if(window.speechSynthesis)speechSynthesis.cancel();
  render();window.scrollTo(0,0);
}
function viewResult(){
  var R=ST.result;

  var pct=Math.round(R.score/R.total*100);

  var col=pct>=90?"var(--green)":(pct>=60?"var(--amber)":"var(--red)");
  var html='<div class="card"><div class="score"><div class="num" style="color:'+col+'">'+R.score+'<small> / '+R.total+'</small></div>'+

/* 错题记录 → 可练习题对象（尽量从原题库还原题型与选项） */
function wrongToQ(w){
  var i;
  if(w.s==="en"){
    for(i=0;i<EN.length;i++){
      if(EN[i].say===w.q&&EN[i].a===w.a){
        return {kind:"en",s:"en",say:EN[i].say,zh:EN[i].zh,type:EN[i].type,a:EN[i].a,ans:EN[i].a,opts:EN[i].opts?EN[i].opts.slice():null};
      }
    }
    var isW=/^[A-Za-z][A-Za-z\s'’!?.,-]*$/.test(String(w.a));
    return {kind:"en",s:"en",say:w.q,zh:"",type:isW?"word":"fill",a:w.a,ans:w.a,opts:null};
  }
  if(w.s==="cn"){
    for(i=0;i<CN.length;i++){
      if(CN[i].t===w.q&&CN[i].a===w.a)return {kind:"cn",s:"cn",text:CN[i].t,ans:CN[i].a,tip:CN[i].tip||""};
    }
    return {kind:"cn",s:"cn",text:w.q,ans:w.a,tip:w.tip||""};
  }
  for(i=0;i<MA.length;i++){
    if(MA[i].t===w.q&&String(MA[i].a)===String(w.a)){
      return {kind:"ma",s:"ma",text:MA[i].t,ans:String(MA[i].a),tip:MA[i].tip||"",unit:MA[i].k||autoKind(MA[i].t)};
    }
  }
  return {kind:"ma",s:"ma",text:w.q,ans:String(w.a),tip:w.tip||"",unit:autoKind(w.q)};
}
function visibleWrong(){
  var out=[],i;
  for(i=0;i<WRONG.length;i++){if(CN_ON||WRONG[i].s!=="cn")out.push({w:WRONG[i],i:i});}
  return out;
}
function startRedoAll(){
  var vw=visibleWrong();
  if(!vw.length){toast("错题本是空的");return;}
  var qs=vw.map(function(o){return wrongToQ(o.w);});
  ST.subj=qs[0].s||"ma";
  ST.qs=qs;ST.idx=0;
  ST.answers=qs.map(function(){return "";});
  ST.plays=qs.map(function(){return 0;});
  ST.curBlank=0;ST.hwStrokes=[];ST.drafts=new Array(ST.qs.length).fill(null);ST.draft=false;
  ST.redo=true;ST.result=null;
  ST.start=Date.now();ST.tab="practice";
  document.body.classList.add("practicing");
  render();window.scrollTo(0,0);

function viewStats(){

  var maxH=Math.max(1,Math.max.apply(null,days.map(function(x){return x.tot;})));

    '<textarea id="bankText" style="margin-top:10px" placeholder="粘贴题库 JSON，例如：&#10;{&quot;english&quot;:[{&quot;say&quot;:&quot;Good morning.&quot;,&quot;zh&quot;:&quot;早上好。&quot;,&quot;q&quot;:&quot;这句话是什么意思？&quot;,&quot;opts&quot;:[&quot;早上好。&quot;,&quot;晚上好。&quot;,&quot;再见。&quot;,&quot;谢谢。&quot;],&quot;a&quot;:&quot;早上好。&quot;}],&#10; &quot;math&quot;:[{&quot;q&quot;:&quot;3千克＝（ ）克&quot;,&quot;a&quot;:&quot;3000&quot;}]}"></textarea>'+

  html+='<div class="card"><div style="font-weight:700;margin-bottom:6px">数据</div>'+
    '<div class="btnrow"><button class="btn line sm" id="expData">导出学习记录</button><button class="btn line sm" id="clearData" style="color:var(--red)">清空全部数据</button></div>'+
    '<div class="tiny" style="margin-top:10px">数据保存在本手机浏览器中，换设备请导出备份。</div></div>';

  html+='<div class="tiny" style="text-align:center;margin:16px 0 30px">每日20分钟 · 江苏三年级（数学苏教/英语译林）</div>';
  return html;
}

/* ---------- 事件绑定 ---------- */
function restoreAnswer(v){
  if(ST.tab!=="practice")return;
  var saved=ST.answers[ST.idx];
  if(!saved)return;
  var ins=v.querySelectorAll(".blankinp");
  if(ins.length){var arr=String(saved).split("|");for(var i=0;i<ins.length;i++)ins[i].value=arr[i]||"";}
  var a0=$("ans0");if(a0)a0.value=String(saved).split("|")[0];
  v.querySelectorAll(".opt").forEach(function(b){if(b.getAttribute("data-o")===saved)b.classList.add("on");});
}
function bind(){
  var v=$("view");
  restoreAnswer(v);
  v.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick=function(){startPractice(b.getAttribute("data-go"));};
  });
  v.querySelectorAll("[data-tabgo]").forEach(function(b){
    b.onclick=function(){go(b.getAttribute("data-tabgo"));};
  });
  // 练习页
  var pb=$("playBtn");
  if(pb)pb.onclick=function(){
    var i=ST.idx;
    if(playLeft(i)<=0){toast("本题最多听 "+S.replay+" 遍，已经听完啦");return;}
    unlockSpeech();
    ST.plays[i]=(ST.plays[i]||0)+1;
    speak(ST.qs[i].say,S.rate);
    var cnt=$("playCnt");if(cnt)cnt.innerHTML=playCountHtml(i);
    if(playLeft(i)<=0){pb.disabled=true;pb.textContent="已听完";}
  };
  var ab2=$("audioBtn");
  if(ab2)ab2.onclick=function(){
    unlockSpeech();
    var i2=ST.idx;
    if(playLeft(i2)>0){
      ST.plays[i2]=(ST.plays[i2]||0)+1;
      speak(ST.qs[i2].say,S.rate);
      var cnt2=$("playCnt");if(cnt2)cnt2.innerHTML=playCountHtml(i2);
    }
    render();
    toast("已开启朗读，点喇叭再听");
  };
  var ssb=$("showSayBtn");
  if(ssb)ssb.onclick=function(){S.showSay=!S.showSay;saveS();render();};
  // 数字键盘 + 手写板
  v.querySelectorAll(".pad button[data-k]").forEach(function(b){
    b.onclick=function(){padType(b.getAttribute("data-k"));};
  });
  var ub=$("unitBtn");
  if(ub)ub.onclick=function(){
    var p=$("padUnit");if(!p)return;
    var open=(p.style.display==="none");
    p.style.display=open?"grid":"none";
    ub.textContent=open?"收起单位":"需要填单位？点这里";
  };
  var at=$("ansTab");if(at)at.onclick=function(){ST.draft=false;render();};
  var dt=$("draftTab");if(dt)dt.onclick=function(){ST.draft=true;render();};
  var dc=$("draftClear");if(dc)dc.onclick=draftClear;
  hwInit();draftInit();
  var hu=$("hwUndo");
  if(hu)hu.onclick=function(){
    ST.hwStrokes=[];
    var cv=$("hw");if(cv&&cv.getContext)hwGrid(cv.getContext("2d"),cv.width,cv.height);
    var c=$("cands");if(c)c.innerHTML='<span class="tiny">在方框里写一个字，抬手后自动出候选</span>';
  };
  var hd=$("hwDel");if(hd)hd.onclick=function(){hwEdit("del");};
  var hc=$("hwClr");if(hc)hc.onclick=function(){hwEdit("clr");};
  var hk=$("hwKb");if(hk)hk.onclick=function(){S.cnInput="key";saveS();render();toast("已切换为键盘输入");};
  v.querySelectorAll(".blanks .bs").forEach(function(b){
    b.onclick=function(){ST.curBlank=+b.getAttribute("data-b");ST.hwStrokes=[];render();};
  });
  v.querySelectorAll(".opt").forEach(function(b){
    b.onclick=function(){
      v.querySelectorAll(".opt").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
    };
  });
  var nb=$("nextBtn");
  if(nb)nb.onclick=function(){
    ST.answers[ST.idx]=collectAnswer();
    if(ST.answers[ST.idx]===""&&!confirm("本题还没有作答，确定继续吗？"))return;
    if(ST.idx<ST.qs.length-1){ST.idx++;ST.curBlank=0;ST.hwStrokes=[];ST.draft=false;render();window.scrollTo(0,0);if(ST.subj==="en"&&S.autoSpeak&&speechUnlocked)setTimeout(autoPlay,300);}
    else finish();
  };
  var pv=$("prevBtn");
  if(pv)pv.onclick=function(){
    ST.answers[ST.idx]=collectAnswer();
    if(ST.idx>0){ST.idx--;ST.curBlank=0;ST.hwStrokes=[];ST.draft=false;render();window.scrollTo(0,0);if(ST.subj==="en"&&S.autoSpeak&&speechUnlocked)setTimeout(autoPlay,300);}
  };
  var qb=$("quitBtn");
  if(qb)qb.onclick=function(){if(confirm("退出后本次作答不保存，确定吗？")){if(window.speechSynthesis)speechSynthesis.cancel();go("home");}};
  var rg=$("regenBtn");
  if(rg)rg.onclick=function(){
    if(ST.redo){toast("错题重做不能换题");return;}
    if(ST.qs.length>1&&ST.answers.some(function(a){return a;})&&!confirm("换一批会清空当前作答，确定吗？"))return;
    regen();
  };
  // 结果页
  var rb=$("redoBtn");
  if(rb)rb.onclick=function(){
    var wrong=ST.result.details.filter(function(d){return !d.ok;}).map(function(d){d.q.s=ST.subj;return d.q;});
    if(!wrong.length){toast("全部正确，无需重做");return;}
    ST.qs=wrong;ST.idx=0;ST.answers=new Array(wrong.length).fill("");ST.plays=new Array(wrong.length).fill(0);
    ST.redo=true;
    ST.start=Date.now();ST.tab="practice";document.body.classList.add("practicing");render();window.scrollTo(0,0);
  };
  var hb=$("homeBtn");if(hb)hb.onclick=function(){go("home");};
  // 错题本
  v.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){var i=+b.getAttribute("data-del");WRONG.splice(i,1);saveWrong();render();toast("已移除");};
  });
  var ra=$("redoAllBtn");
  if(ra)ra.onclick=startRedoAll;
  var cw=$("clearWrong");
  if(cw)cw.onclick=function(){if(confirm("清空所有错题？")){WRONG=[];saveWrong();render();}};
  // 设置
  v.querySelectorAll("[data-cnt]").forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-cnt"),op=b.getAttribute("data-op");
      var lim={cn:[1,20],ma:[5,40],en:[3,20]}[k];
      S.count[k]=Math.max(lim[0],Math.min(lim[1],S.count[k]+(op==="+"?1:-1)));
      saveS();render();
    };
  });
  v.querySelectorAll("[data-min]").forEach(function(b){
    b.onclick=function(){S.goalMin=Math.max(5,Math.min(60,S.goalMin+(b.getAttribute("data-min")==="+"?5:-5)));saveS();render();};
  });
  v.querySelectorAll("[data-mt]").forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-mt"),i=S.mathTypes.indexOf(k);
      if(i>=0){if(S.mathTypes.length>1)S.mathTypes.splice(i,1);else{toast("至少保留一类");return;}}
      else S.mathTypes.push(k);
      saveS();render();
    };
  });
  v.querySelectorAll("[data-cl]").forEach(function(b){
    b.onclick=function(){
      var u=b.getAttribute("data-cl");
      var cur=(S.cnLessons&&S.cnLessons.length)?S.cnLessons.slice():["第6课"];
      var ix=cur.indexOf(u);
      if(ix>=0)cur.splice(ix,1);else cur.push(u);
      S.cnLessons=cur;saveS();render();
    };
  });
  v.querySelectorAll("[data-ck]").forEach(function(b){
    b.onclick=function(){
      var kk=b.getAttribute("data-ck");
      var all=["zi","ci","shi"];
      var cur=(S.cnKinds&&S.cnKinds.length)?S.cnKinds.slice():all.slice();
      var ix=cur.indexOf(kk);
      if(ix>=0)cur.splice(ix,1);else cur.push(kk);
      if(cur.length===all.length)cur=[];
      S.cnKinds=cur;saveS();render();
    };
  });
  v.querySelectorAll("[data-eu]").forEach(function(b){
    b.onclick=function(){
      var u=b.getAttribute("data-eu");
      var all=["U1","U2","U3","U4","U5","U6","U7","U8"];
      var cur=(S.enUnits&&S.enUnits.length)?S.enUnits.slice():all.slice();
      var ix=cur.indexOf(u);
      if(ix>=0)cur.splice(ix,1);else cur.push(u);
      if(cur.length===all.length)cur=[];
      S.enUnits=cur;saveS();render();
    };
  });
  v.querySelectorAll("[data-mr]").forEach(function(b){
    b.onclick=function(){S.mixRate=parseFloat(b.getAttribute("data-mr"));saveS();render();};
  });
  var rs=$("rateSel");if(rs)rs.onchange=function(){S.rate=parseFloat(rs.value);saveS();};
  var cis=$("cnInputSel");if(cis)cis.onchange=function(){S.cnInput=cis.value;saveS();render();};
  var mis=$("maInputSel");if(mis)mis.onchange=function(){S.maPad=(mis.value==="true");saveS();render();};
  var rps=$("replaySel");if(rps)rps.onchange=function(){S.replay=parseInt(rps.value);saveS();render();};
  var ab=$("autoBtn");if(ab)ab.onclick=function(){S.autoSpeak=!S.autoSpeak;saveS();render();};
  var ts=$("testSpeak");
  if(ts)ts.onclick=function(){unlockSpeech();speak("Good morning, this is a test.",S.rate);toast("已朗读测试句，听不到请看下方检测说明");setTimeout(render,600);};
  var eb=$("expBank");
  if(eb)eb.onclick=function(){download("题库备份.json",{cn:CN,ma:MA,en:EN});};
  var ib=$("impBankBtn");
  if(ib)ib.onclick=function(){document.getElementById("bankText").focus();toast("请粘贴 JSON 后点确认导入");};
  var di=$("doImport");
  if(di)di.onclick=function(){
    var txt=$("bankText").value.trim();
    if(!txt){toast("请先粘贴内容");return;}
    try{
      var o=JSON.parse(txt);
      var cnRaw=o.cn||o.chinese||[], maRaw=o.ma||o.math||[], enRaw=o.en||o.english||[];
      var cn=cnRaw.map(function(x){return {t:x.t||x.q||"",a:x.a||"",tip:x.tip||"",g:x.g||x.grade||"第6课",k:x.k||(x.type==="诗"?"shi":"ci")};}).filter(function(x){return x.t&&x.a;});
      var ma=maRaw.map(function(x){return {t:x.t||x.q||"",a:String(x.a==null?"":x.a),tip:x.tip||"",g:x.g||"",k:x.k||autoKind(x.t||x.q||"")};}).filter(function(x){return x.t&&x.a!=="";});
      var en=enRaw.map(function(x){return {say:x.say||x.en||"",zh:x.zh||"",type:x.type||"dlg",q:x.q||"",opts:x.opts||null,a:x.a||"",u:x.u||x.unit||""};}).filter(function(x){return (x.say||x.q)&&x.a;});
      var msg=[];
      if(cn.length){save("bank_cn",cn);CN=cn;msg.push("语文 "+cn.length);}
      if(ma.length){save("bank_ma",ma);MA=ma;msg.push("数学 "+ma.length);}
      if(en.length){save("bank_en",en);EN=en;msg.push("英语 "+en.length);}
      if(!msg.length){toast("没识别到题目，请检查格式");return;}
      saveS();toast("导入成功："+msg.join(" / "));
      setTimeout(render,600);
    }catch(e){toast("格式有误："+e.message);}
  };
  var ed=$("expData");
  if(ed)ed.onclick=function(){
    var o={settings:S,wrong:WRONG,days:{}};
    for(var k in localStorage){if(k.indexOf(KEY+"day_")===0)o.days[k.slice(KEY.length)]=JSON.parse(localStorage.getItem(k));}
    download("学习记录备份.json",o);
  };
  var cd=$("clearData");
  if(cd)cd.onclick=function(){
    if(confirm("将清空所有练习记录、错题和设置，确定吗？")){
      for(var k in localStorage){if(k.indexOf(KEY)===0)localStorage.removeItem(k);}
      location.reload();
    }
  };
  // 顶部日期
  if(ST.tab==="home"){$("tbDate").textContent=dstr();$("tbStreak").textContent="连续 "+streakDays()+" 天";}
  else if(ST.tab==="practice"){$("tbDate").textContent=({cn:"语文默写",ma:"数学计算",en:"英语对话"})[ST.subj];}
  else if(ST.tab==="result"){$("tbDate").textContent="批改完成";}
  else $("tbDate").textContent="三年级 · 每日练习";
}
document.getElementById("tabbar").querySelectorAll(".tb").forEach(function(b){
  b.onclick=function(){go(b.getAttribute("data-tab"));};
});

function download(name,obj){
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100);
}

/* 启动 */
loadVoices();
render();
</script>
</body>
</html>
